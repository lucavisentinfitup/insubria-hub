# Blueprint Render per Insubria Hub.
# Piano gratuito: indirizzo onrender.com con HTTPS. Il disco non è persistente: database, file caricati
# e iscrizioni alle notifiche si azzerano a ogni riavvio o dopo 15 minuti senza visite.
# Per conservare i dati: plan 0.5c-512mb + disk (mountPath /var/data) e DATA_DIR=/var/data/insubria-hub.
services:
  - type: web
    name: insubria-hub
    runtime: node
    plan: free
    region: frankfurt
    rootDir: app
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /manifest.webmanifest
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: STAFF_DOMAINS
        value: uninsubria.it
      # Notifiche push: la chiave pubblica non è segreta, la privata va inserita nel pannello Render
      - key: VAPID_PUBLIC_KEY
        value: BEoNKouKe0-RcPBj5cmefEaFf3P2k-QrZ8Uy4OJsOxmYihsENTUoZrZO2cH0OBOlCySM2Ph9MdsDM3y3opFJaF0
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:infoeventiinsubria@gmail.com
      # Email con il codice di accesso, inviate tramite l'API HTTPS di Brevo: il piano gratuito blocca le porte SMTP.
      # MAIL_FROM deve essere un mittente verificato nell'account Brevo. Le variabili SMTP_* restano per altri hosting.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Insubria Hub <infoeventiinsubria@gmail.com>
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
