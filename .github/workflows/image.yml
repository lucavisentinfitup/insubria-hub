# Costruisce l'immagine Docker dell'app a ogni push su main e la pubblica su GitHub Container Registry,
# per processori Intel/AMD e ARM: il NAS la scarica senza dover compilare nulla.
name: Immagine Docker

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lucavisentinfitup/insubria-hub:latest
            ghcr.io/lucavisentinfitup/insubria-hub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
