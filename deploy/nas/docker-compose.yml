# Insubria Hub sul NAS di casa (QNAP Container Station o qualsiasi Docker con Compose).
# app: il server Node, con database e file caricati in ./data (persistenti).
# backup: stessa immagine, ogni notte alle 3:30 copia database e file in ./backup (30 giorni).
# tunnel: Cloudflare Tunnel, pubblica l'app in HTTPS sul tuo dominio senza aprire porte sul router.
# L'immagine viene costruita da GitHub a ogni commit su main: per aggiornare basta "docker compose pull && docker compose up -d".
name: insubria-hub

x-image: &image ghcr.io/lucavisentinfitup/insubria-hub:latest

services:
  app:
    image: *image
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    # raggiungibile anche in rete locale su http://IP-DEL-NAS:3210 (comodo per provarla prima del tunnel)
    ports:
      - "3210:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  backup:
    image: *image
    restart: unless-stopped
    command: ["node", "tools/backup.mjs"]
    environment:
      TZ: Europe/Rome
      DATA_DIR: /data
      BACKUP_DIR: /backup
      BACKUP_AT: "03:30"
      BACKUP_KEEP_DAYS: "30"
    volumes:
      - ./data:/data
      - ./backup:/backup

  tunnel:
    # cloudflared ufficiale, ricostruito anche per ARM a 32 bit (deploy/tunnel)
    image: ghcr.io/lucavisentinfitup/insubria-hub-tunnel:latest
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    profiles: ["tunnel"]
