# Insubria Hub sul NAS di casa.
# app: il server Node, con database e file caricati in ./data (persistenti).
# tunnel: Cloudflare Tunnel, pubblica l'app in HTTPS sul tuo dominio senza aprire porte sul router.
# backup: ogni notte copia coerente del database e dei file in ./backup, conservata 30 giorni.
name: insubria-hub

services:
  app:
    build: ../../app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    # nessuna porta pubblicata: ci arriva solo il tunnel. Per provarla in rete locale togli il commento:
    # ports:
    #   - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/manifest.webmanifest').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy

  backup:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
      - ./backup:/backup
      - ./backup.sh:/backup.sh:ro
    environment:
      TZ: Europe/Rome
    # ogni notte alle 3:30
    command: sh -c 'apk add --no-cache sqlite tzdata >/dev/null && echo "30 3 * * * sh /backup.sh" | crontab - && crond -f -l 8'
