<title>Insubria Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: una colonna "telefono" centrata, pannelli liquid glass su un fondo di bolle verdi Insubria, tab bar flottante in basso */
:root {
  --ink: #0d2b27;
  --ink-soft: #4a6662;
  --ground: #eef5f3;
  --brand: #066858;          /* verde Insubria (dal CSS del sito ufficiale) */
  --brand-deep: #004e43;
  --mint: #6fd8bd;
  --peach: #ffbc7b;          /* accento caldo, presente anche nel CSS del sito */
  --sky: #9cc9ff;
  --glass: rgba(255,255,255,.58);
  --glass-strong: rgba(255,255,255,.78);
  --glass-edge: rgba(255,255,255,.75);
  --glass-hi: rgba(255,255,255,.9);
  --hair: rgba(13,43,39,.10);
  --shadow: rgba(6,62,53,.14);
  --ok: #1f9d6b;
  --warn: #c7771b;
  --bad: #c2413b;
  --on-brand: #ffffff;
  --blob-a: #7fe3c8;
  --blob-b: #ffd2a3;
  --blob-c: #a9d2ff;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Onest", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --r-l: 28px; --r-m: 20px; --r-s: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #e6f4f0; --ink-soft: #9db9b3; --ground: #071a17;
  --brand: #3fc3a2; --brand-deep: #8fe6cf; --mint: #3fc3a2; --peach: #ffb46b; --sky: #7fb2f0;
  --glass: rgba(22,48,44,.52); --glass-strong: rgba(24,52,48,.82); --glass-edge: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.14);
  --hair: rgba(230,244,240,.10); --shadow: rgba(0,0,0,.45);
  --ok: #4fd39a; --warn: #f0a24a; --bad: #ff7a72; --on-brand: #04201b;
  --blob-a: #0f6b58; --blob-b: #6b4420; --blob-c: #1d4370;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --ink: #e6f4f0; --ink-soft: #9db9b3; --ground: #071a17;
  --brand: #3fc3a2; --brand-deep: #8fe6cf; --mint: #3fc3a2; --peach: #ffb46b; --sky: #7fb2f0;
  --glass: rgba(22,48,44,.52); --glass-strong: rgba(24,52,48,.82); --glass-edge: rgba(255,255,255,.10); --glass-hi: rgba(255,255,255,.14);
  --hair: rgba(230,244,240,.10); --shadow: rgba(0,0,0,.45);
  --ok: #4fd39a; --warn: #f0a24a; --bad: #ff7a72; --on-brand: #04201b;
  --blob-a: #0f6b58; --blob-b: #6b4420; --blob-c: #1d4370;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; border-radius: 10px; }

/* fondo */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .85; animation: drift 22s ease-in-out infinite alternate; }
.bg i:nth-child(1) { width: 62vmax; height: 62vmax; background: var(--blob-a); left: -22vmax; top: -18vmax; }
.bg i:nth-child(2) { width: 46vmax; height: 46vmax; background: var(--blob-b); right: -18vmax; top: 30vh; animation-duration: 27s; }
.bg i:nth-child(3) { width: 50vmax; height: 50vmax; background: var(--blob-c); left: 10vw; bottom: -30vmax; animation-duration: 31s; }
@keyframes drift { to { transform: translate3d(6vmax, 4vmax, 0) scale(1.08); } }

.glass { background: var(--glass); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), 0 12px 32px -12px var(--shadow); }

.app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; padding-block: 14px 10px; }
.top::before { content: ""; position: absolute; inset: 0 -16px; background: linear-gradient(var(--ground), transparent); opacity: .7; z-index: -1; }
.mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); font: 800 18px/1 var(--font-display); box-shadow: 0 6px 18px -6px var(--brand); }
.top .t { flex: 1; min-width: 0; }
.top .t small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.top .t b { font: 700 20px/1.1 var(--font-display); }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; font-weight: 600; color: var(--brand-deep); }

main { display: grid; gap: 16px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }
.section-h h2 { font-size: 19px; }
.section-h button, .link-btn { background: none; border: 0; color: var(--brand); font-weight: 600; cursor: pointer; padding: 4px 0; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; }
.muted { color: var(--ink-soft); }
.panel { border-radius: var(--r-l); padding: 18px; }
.row { display: flex; gap: 12px; align-items: center; }
.stack { display: grid; gap: 10px; }

/* hero */
.hero { border-radius: var(--r-l); padding: 20px; display: grid; gap: 14px; }
.hero h1 { font-size: 30px; line-height: 1.05; font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--brand); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpi { padding: 10px 12px; border-radius: var(--r-s); background: var(--glass-strong); }
.kpi b { display: block; font: 800 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 11.5px; color: var(--ink-soft); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--glass-edge); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: transparent; }

.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s ease; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 8px 20px -8px var(--brand); }
.btn.ghost { background: var(--glass-strong); border: 1px solid var(--glass-edge); }
.btn.small { padding: 7px 13px; font-size: 13.5px; }
.btn[disabled] { opacity: .5; cursor: default; }

.tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border-radius: var(--r-m); padding: 12px 10px; text-decoration: none; color: var(--ink); display: grid; gap: 6px; justify-items: start; font-size: 13px; font-weight: 600; line-height: 1.2; }
.tile svg { width: 22px; height: 22px; color: var(--brand); }

/* libretto */
.ring-wrap { display: grid; grid-template-columns: 116px 1fr; gap: 16px; align-items: center; }
.ring { position: relative; width: 116px; height: 116px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .c b { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ring .c span { font-size: 11px; color: var(--ink-soft); }
.stat-list { display: grid; gap: 8px; }
.stat-list div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--hair); padding-bottom: 6px; }
.stat-list div:last-child { border: 0; padding: 0; }
.stat-list b { font-variant-numeric: tabular-nums; font-family: var(--font-display); font-size: 17px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-soft); font: 10px var(--font-body); }
.exam { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--hair); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.exam:last-child { border-bottom: 0; }
.grade { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font: 800 20px/1 var(--font-display); font-variant-numeric: tabular-nums; background: var(--glass-strong); }
.grade.hi { background: var(--brand); color: var(--on-brand); }
.grade.plan { border: 1.5px dashed var(--ink-soft); background: transparent; color: var(--ink-soft); font-size: 13px; }
.exam .n { font-weight: 600; line-height: 1.25; min-width: 0; }
.exam .m { font-size: 12.5px; color: var(--ink-soft); }
.pill { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--glass-strong); white-space: nowrap; }
.pill.ok { color: var(--ok); }
.pill.warn { color: var(--warn); }
.banner { border-radius: var(--r-m); padding: 12px 14px; display: flex; gap: 10px; align-items: center; background: color-mix(in srgb, var(--peach) 35%, transparent); border: 1px solid color-mix(in srgb, var(--peach) 60%, transparent); font-size: 13.5px; }
.banner > div { flex: 1; min-width: 0; }

/* community */
.search { display: flex; gap: 8px; align-items: center; border-radius: 999px; padding: 4px 6px 4px 14px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; outline: none; }
.search select { border: 0; background: var(--glass-strong); border-radius: 999px; padding: 7px 10px; max-width: 46%; font-size: 13px; }
.post { border-radius: var(--r-m); padding: 14px 16px; display: grid; gap: 8px; cursor: pointer; text-align: left; width: 100%; }
.post h3 { font-size: 16.5px; line-height: 1.25; }
.post p { margin: 0; color: var(--ink-soft); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-soft); }
.tag { padding: 2px 8px; border-radius: 999px; background: var(--glass-strong); font-weight: 600; color: var(--ink); }
.tag.uni { background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand-deep); }
.vote { margin-left: auto; border: 0; background: var(--glass-strong); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; }
.vote[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.empty { border-radius: var(--r-l); padding: 24px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 40px; height: 40px; color: var(--brand); }
.reply { padding: 10px 0; border-bottom: 1px solid var(--hair); display: grid; gap: 3px; }
.reply:last-child { border-bottom: 0; }

/* eventi */
.event { display: grid; grid-template-columns: 58px 1fr; gap: 14px; border-radius: var(--r-m); padding: 14px; align-items: start; }
.date-badge { border-radius: 16px; text-align: center; padding: 8px 0; background: var(--brand); color: var(--on-brand); }
.date-badge b { display: block; font: 800 22px/1 var(--font-display); }
.date-badge span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
.ig { display: flex; gap: 14px; align-items: center; border-radius: var(--r-l); padding: 16px; text-decoration: none; color: var(--ink); }
.ig .logo { width: 52px; height: 52px; border-radius: 16px; flex: none; display: grid; place-items: center; color: #fff; background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.ig .logo svg { width: 26px; height: 26px; }

/* assistente */
.chat { display: grid; gap: 10px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 20px; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
.msg.me { justify-self: end; background: var(--brand); color: var(--on-brand); border-bottom-right-radius: 6px; }
.msg.me a { color: inherit; }
.msg.ai { justify-self: start; border-bottom-left-radius: 6px; }
.msg.ai p { margin: 0 0 8px; } .msg.ai p:last-child { margin: 0; }
.msg.ai ul { margin: 4px 0 8px; padding-left: 18px; }
.composer { position: sticky; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: flex-end; border-radius: 26px; padding: 6px 6px 6px 16px; }
.composer textarea { flex: 1; min-width: 0; border: 0; background: transparent; resize: none; outline: none; padding: 9px 0; max-height: 120px; }
.icon-btn { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; background: var(--brand); color: var(--on-brand); }
.icon-btn svg { width: 20px; height: 20px; }
.dots span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); margin-right: 4px; animation: blink 1.2s infinite; }
.dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .25; } }

/* quantum */
.quantum { border-radius: var(--r-l); padding: 18px; display: grid; gap: 10px; position: relative; overflow: hidden; }
.quantum::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: conic-gradient(from 90deg, var(--mint), var(--sky), var(--peach), var(--mint)); filter: blur(30px); opacity: .55; }
.quantum > * { position: relative; z-index: 1; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--warn); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 22%, transparent); }

/* tab bar */
.tabbar { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(448px, calc(100% - 24px)); border-radius: 30px; padding: 6px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabbar button { border: 0; background: transparent; border-radius: 24px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: background .25s ease, color .25s ease; }
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button[aria-current="page"] { background: var(--glass-strong); color: var(--brand); box-shadow: inset 0 1px 0 var(--glass-hi); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(4,26,22,.35); display: grid; align-items: end; justify-items: center; }
.sheet { width: min(480px, 100%); max-height: 92%; overflow-y: auto; border-radius: 30px 30px 0 0; padding: 10px 18px calc(24px + env(safe-area-inset-bottom, 0px)); background: var(--glass-strong); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border: 1px solid var(--glass-edge); animation: up .32s cubic-bezier(.2,.9,.3,1.1); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--hair); margin: 0 auto 12px; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet h2 { font-size: 22px; margin-bottom: 4px; }
form.f { display: grid; gap: 12px; margin-top: 12px; }
.field { display: grid; gap: 5px; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--hair); background: var(--glass); border-radius: var(--r-s); padding: 11px 13px; outline: none; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check input { margin-top: 3px; accent-color: var(--brand); width: 18px; height: 18px; flex: none; }
.hint { font-size: 12px; color: var(--ink-soft); }
.hint.ok { color: var(--ok); font-weight: 600; }
.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top, 0px)); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.roadmap { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 14px; position: relative; }
.step::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--hair); }
.step:last-child::before { display: none; }
.step i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--brand); background: var(--ground); }
.step.now i { background: var(--brand); }
.step b { display: block; font-size: 14.5px; }
.step span { font-size: 13px; color: var(--ink-soft); }
.view-in { animation: fade .35s ease; }
@keyframes fade { from { opacity: .4; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .tile-grid { grid-template-columns: repeat(2, 1fr); } .hero h1 { font-size: 26px; } .ring-wrap { grid-template-columns: 1fr; justify-items: center; } }
</style>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">

    <div class="mark" aria-hidden="true">i</div>

</div>

  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="libretto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v16H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M4 20.5A1.5 1.5 0 0 0 5.5 22H19v-3"/><path d="M8 8h7M8 12h5"/></svg>Libretto</button>
  <button data-tab="community"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>Community</button>
  <button data-tab="eventi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/><path d="m12 12.5.9 1.9 2.1.3-1.5 1.4.4 2.1-1.9-1-1.9 1 .4-2.1-1.5-1.4 2.1-.3z"/></svg>Eventi</button>

</nav>

<script>
/* ------------------------------------------------------------------ dati */
const DEPARTMENTS = [
  { id: "DBSV", name: "Biotecnologie e scienze della vita", city: "Varese" },
  { id: "DiDEC", name: "Diritto, economia e culture", city: "Como" },
  { id: "DiECO", name: "Economia", city: "Varese" },
  { id: "DMC", name: "Medicina e chirurgia", city: "Varese" },
  { id: "DiMIT", name: "Medicina e innovazione tecnologica", city: "Varese" },
  { id: "DISAT", name: "Scienza e alta tecnologia", city: "Como" },
  { id: "DISTA", name: "Scienze teoriche e applicate", city: "Varese" },

const writeChain = {};
async function loadPrivate(key) {
  if (S.db && S.uid) {

}
function savePrivate(key, value) {

}

function stats() {
  const passed = S.exams.filter(e => e.status === "passed");
  const graded = passed.filter(e => typeof e.grade === "number");
  const cfu = passed.reduce((a, e) => a + Number(e.cfu || 0), 0);
  const gCfu = graded.reduce((a, e) => a + Number(e.cfu || 0), 0);
  const arit = graded.length ? graded.reduce((a, e) => a + e.grade, 0) / graded.length : 0;
  const pond = gCfu ? graded.reduce((a, e) => a + e.grade * e.cfu, 0) / gCfu : 0;
  const target = COURSE_CFU[S.profile?.courseType] || 180;
  return { passed, graded, cfu, gCfu, arit, pond, base: pond / 30 * 110, target, lodi: graded.filter(e => e.lode).length };
}

function vChart(graded) {
  const pts = graded.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const W = 320, H = 130, L = 26, R = 10, T = 10, B = 20;
  const x = i => L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1));
  const y = v => T + (30 - v) * (H - T - B) / 12;
  let sw = 0, sc = 0;
  const avg = pts.map(p => { sw += p.grade * p.cfu; sc += p.cfu; return sw / sc; });
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.grade).toFixed(1)}`).join("");
  const area = line + `L${x(pts.length - 1).toFixed(1)},${H - B}L${x(0).toFixed(1)},${H - B}Z`;
  const aLine = avg.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const grid = [18, 22, 26, 30].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--hair)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Voti in ordine di data">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".28"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="${aLine}" fill="none" stroke="var(--peach)" stroke-width="2" stroke-dasharray="4 3"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.grade)}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="var(--brand)" stroke="var(--ground)" stroke-width="1.5"><title>${esc(p.name)}: ${p.grade}</title></circle>`).join("")}
    <text x="${L}" y="${H - 4}">${fmtDate(pts[0].date, { month: "short", year: "2-digit" })}</text>
    <text x="${W - R}" y="${H - 4}" text-anchor="end">${fmtDate(pts[pts.length - 1].date, { month: "short", year: "2-digit" })}</text>
  </svg>`;
}

function vSimulator(st) {
  const plan = S.exams.find(e => e.status === "planned");

  return `<section class="panel glass stack">

    <div class="row" id="sim-out" style="justify-content:space-between;font-size:14px">${simOut(st, plan, g)}</div>

}
function simOut(st, plan, g) {
  const nc = st.gCfu + Number(plan.cfu);
  const np = nc ? (st.pond * st.gCfu + g * plan.cfu) / nc : 0;
  const diff = np - st.pond;
  return `<span>Con <b style="font-family:var(--font-display);font-size:18px">${g}</b></span><span>media <b>${f2(np)}</b> <span style="color:${diff >= 0 ? "var(--ok)" : "var(--bad)"}">(${diff >= 0 ? "+" : ""}${diff.toFixed(2).replace(".", ",")})</span> · base <b>${(np / 30 * 110).toFixed(1).replace(".", ",")}</b></span>`;
}

/* markdown minimale per le risposte dell'assistente */
function md(src) {
  let h = esc(src);
  h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, pre, url) => { const tail = (url.match(/[.,;:!?]+$/) || [""])[0]; url = url.slice(0, url.length - tail.length); return `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>${tail}`; });
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return h.split(/\n{2,}/).map(block => {
    const lines = block.split("\n");
    if (lines.every(l => /^\s*([-*•]|\d+\.)\s+/.test(l))) return "<ul>" + lines.map(l => "<li>" + l.replace(/^\s*([-*•]|\d+\.)\s+/, "") + "</li>").join("") + "</ul>";
    return "<p>" + lines.join("<br>") + "</p>";
  }).join("");
}

  if (!S.sample) { toast(S.sample === null ? "L'assistente funziona aprendo l'app dentro Claude" : "Assistente in avvio, riprova tra un attimo"); return; }
  S.chat.push({ role: "user", content: text });
  S.busy = true; S.streaming = false; S.ctl = new AbortController();
  render(true); scrollChat();
  const turns = S.chat.slice(-12);
  const idx = S.chat.length;
  try {
    const { text: out } = await S.sample([{ role: "user", content: ASSISTANT_RULES() }, ...turns], {
      cache: false, signal: S.ctl.signal, modelTier: "default",
      onText: ({ text: t }) => {
        if (!S.streaming) { S.streaming = true; S.chat.push({ role: "assistant", content: t }); render(true); }
        else { S.chat[idx].content = t; const last = document.querySelectorAll("#chat .msg.ai"); if (last.length) last[last.length - 1].innerHTML = md(t); }
        scrollChat();
      },
    });
    if (S.chat[idx]) S.chat[idx].content = out; else S.chat.push({ role: "assistant", content: out });
  } catch (e) {
    const partial = e?.text;
    if (S.chat[idx] && e?.code !== "refused" && partial) S.chat[idx].content = partial;
    else if (S.chat[idx]) S.chat.splice(idx, 1);
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") S.sample = null;
    if (e?.code !== "cancelled") toast(SAMPLE_ERR[e?.code] || "Risposta interrotta. Riprova.");
    if (S.chat[S.chat.length - 1]?.role === "user" && e?.code !== "cancelled" && !partial) { /* la domanda resta: lo studente può riprovare */ }
  } finally {
    S.busy = false; S.streaming = false; S.ctl = null;
    if (S.tab === "ai") { render(true); scrollChat(); }
  }
}

document.addEventListener("click", async ev => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) return go(tabBtn.dataset.tab);
  const goBtn = ev.target.closest("[data-tab-go]");
  if (goBtn) return go(goBtn.dataset.tabGo);
  const askBtn = ev.target.closest("[data-ask]");
  if (askBtn) return ask(askBtn.dataset.ask);
  const area = ev.target.closest("[data-area]");
  if (area) { S.filter.area = area.dataset.area; return render(true); }
  const city = ev.target.closest("[data-city]");
  if (city) { S.evCity = city.dataset.city; return render(true); }
  const stBtn = ev.target.closest("[data-status]");
  if (stBtn) {
    $("#e-status").value = stBtn.dataset.status;
    document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", b === stBtn));
    $("#grade-row").hidden = stBtn.dataset.status === "planned";
    return;
  }
  const a = ev.target.closest("[data-act]");
  if (!a) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (act === "scrim" && ev.target !== a) return;
  switch (act) {
    case "scrim": case "close": closeSheet(); break;
    case "profile": sheetProfile(); break;
    case "add-exam": sheetExam(); break;
    case "edit-exam": sheetExam(S.exams.find(e => e.id === id)); break;
    case "del-exam": S.exams = S.exams.filter(e => e.id !== id); persistExams(); closeSheet(); render(true); toast("Esame eliminato"); break;
    case "new-post": sheetPost(); break;
    case "open-post": if (!ev.target.closest(".vote")) sheetOpenPost(id); break;
    case "vote": {
      ev.stopPropagation();
      if (!S.db || !S.uid) { toast("Accedi a Claude per votare"); break; }
      const p = S.posts.find(x => x.id === id); if (!p) break;
      try { await S.db.doc(`posts/${id}`).update({ votes: { [S.uid]: !p.votes?.[S.uid] } }); } catch { toast("Voto non registrato. Riprova."); }
      break;
    }
    case "del-post": try { await S.db.doc(`posts/${id}`).delete(); closeSheet(); toast("Domanda eliminata"); } catch { toast("Non sono riuscito a eliminarla"); } break;
    case "add-event": sheetEvent(); break;
    case "del-event": try { await S.db.doc(`events/${id}`).delete(); toast("Evento eliminato"); } catch { toast("Non sono riuscito a eliminarlo"); } break;
    case "stop": S.ctl?.abort(); break;
    case "reset-chat": S.ctl?.abort(); S.chat = []; render(); break;
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && $("#sheet-root").innerHTML) closeSheet();
  if (ev.key === "Enter" && ev.target.matches(".post")) sheetOpenPost(ev.target.dataset.id);
  if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "ask") { ev.preventDefault(); const v = ev.target.value; ev.target.value = ""; ask(v); }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q") { S.filter.q = t.value; clearTimeout(S.qT); S.qT = setTimeout(() => render(true), 160); }
  if (t.id === "p-email") $("#email-hint").innerHTML = emailHint(t.value);
  if (t.id === "sim") { S.simGrade = Number(t.value); const plan = S.exams.find(e => e.status === "planned"); if (plan) $("#sim-out").innerHTML = simOut(stats(), plan, S.simGrade); }
  if (t.matches(".composer textarea")) { t.style.height = "auto"; t.style.height = Math.min(120, t.scrollHeight) + "px"; }
});
document.addEventListener("change", ev => { if (ev.target.id === "uni-filter") { S.filter.uni = ev.target.value; render(true); } });

document.addEventListener("submit", async ev => {
  ev.preventDefault();
  const f = ev.target;
  const val = id => ($("#" + id)?.value || "").trim();
  const err = (id, msg) => { const e = $("#" + id); e.textContent = msg; e.hidden = false; };
  if (f.id === "ask-form") { const v = val("ask"); $("#ask").value = ""; ask(v); }
  if (f.id === "profile-form") {
    const p = { firstName: val("p-first"), lastName: val("p-last"), email: val("p-email"), phone: val("p-phone"), uni: val("p-uni"), dep: val("p-dep"), course: val("p-course"), courseType: val("p-type"), year: val("p-year"), privacy: $("#p-privacy").checked, improve: $("#p-improve").checked, updatedAt: Date.now() };
    if (!p.firstName || !p.lastName) return err("p-err", "Inserisci nome e cognome.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email)) return err("p-err", "Controlla l'email: manca la @ o il dominio.");
    if (p.phone && !/^\+?[\d\s]{8,16}$/.test(p.phone)) return err("p-err", "Il cellulare può contenere solo cifre, spazi e il prefisso +.");
    if (!p.privacy) return err("p-err", "Per creare il profilo serve il consenso all'informativa privacy.");
    p.uniEmail = /@(studenti\.)?uninsubria\.it$/i.test(p.email);
    const first = !S.profile;
    S.profile = p; await savePrivate("profile", p);
    closeSheet(); render(true); toast(first ? "Profilo creato" : "Profilo aggiornato");
  }
  if (f.id === "exam-form") {
    const name = val("e-name"), status = val("e-status"), cfu = Number(val("e-cfu")), g = val("e-grade");
    if (!name) return err("e-err", "Scrivi il nome dell'insegnamento.");
    if (!(cfu >= 1 && cfu <= 30)) return err("e-err", "I CFU vanno da 1 a 30.");
    const exam = { id: f.dataset.id || uidGen(), name, cfu, date: val("e-date"), status, idoneita: status === "passed" && g === "ID", grade: status === "passed" && g !== "ID" ? Number(g) : null, lode: status === "passed" && g === "30" && $("#e-lode").checked };
    if (S.demo) S.exams = [];
    const i = S.exams.findIndex(e => e.id === exam.id);
    if (i >= 0) S.exams[i] = exam; else S.exams.push(exam);
    persistExams(); closeSheet(); render(true); toast(i >= 0 ? "Esame aggiornato" : "Esame aggiunto");
  }
  if (f.id === "post-form") {
    const title = val("n-title"), body = val("n-body");
    if (title.length < 6) return err("n-err", "Il titolo deve avere almeno 6 caratteri.");
    if (body.length < 10) return err("n-err", "Aggiungi qualche dettaglio in più nel testo.");
    try {
      await S.db.collection("posts").add({ title, body, uni: val("n-uni"), area: val("n-area"), subject: val("n-subject"), authorId: S.uid, createdAt: Date.now(), votes: {} });
      closeSheet(); S.filter.uni = val("n-uni") || S.filter.uni; toast("Domanda pubblicata");
    } catch (e) { err("n-err", e?.code === "quota_exceeded" ? "La community è piena: contatta gli amministratori." : "Non hai i permessi per pubblicare qui. Chiedi accesso come Contributor."); }
  }
  if (f.id === "reply-form") {
    const body = val("reply");
    if (!body || !S.openPost) return;
    $("#reply").value = "";
    try { await S.db.collection(`posts/${S.openPost}/replies`).add({ body, authorId: S.uid, createdAt: Date.now() }); } catch { toast("Risposta non inviata. Riprova."); $("#reply").value = body; }
  }
  if (f.id === "event-form") {
    const title = val("v-title"), date = val("v-date"), link = val("v-link");
    if (!title || !date) return err("v-err", "Titolo e data sono obbligatori.");
    if (link && !/^https:\/\//.test(link)) return err("v-err", "Il link deve iniziare con https://");
    try { await S.db.collection("events").add({ title, date, time: val("v-time"), city: val("v-city"), place: val("v-place"), link, desc: val("v-desc"), createdAt: Date.now() }); closeSheet(); toast("Evento pubblicato"); }
    catch { err("v-err", "Solo gli editor dell'app possono pubblicare eventi."); }
  }
});

/* ------------------------------------------------------------------ avvio */
(function boot() {
  try { const t = localStorage.getItem("ih_tab"); if (t && TITLES[t]) S.tab = t; } catch {}
  if (["home", "libretto", "community", "eventi", "ai"].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);
  const lp = ls.get("profile"), ll = ls.get("libretto");
  if (lp) S.profile = lp;
  if (ll?.exams) { S.exams = ll.exams; S.demo = false; }
  render();

  const C = window.claude;
  if (!C?.use) { S.sample = null; S.postsState = "offline"; S.eventsState = "offline"; render(true); return; }
  C.use("sample").then(s => { S.sample = s; if (S.tab === "ai") render(true); });
  Promise.all([C.use("db"), C.use("user")]).then(async ([db, user]) => {
    S.db = db; S.user = user;
    if (user) { S.uid = await user.id(); S.canEdit = await user.canEdit().catch(() => false); }
    if (db && S.uid) {
      const [p, l] = await Promise.all([loadPrivate("profile"), loadPrivate("libretto")]);
      if (p) S.profile = p; else if (S.profile) savePrivate("profile", S.profile);
      if (l?.exams) { S.exams = l.exams; S.demo = false; } else if (!S.demo) savePrivate("libretto", { exams: S.exams });
    }
    if (!db) { S.postsState = "offline"; S.eventsState = "offline"; render(true); return; }
    db.collection("posts").orderBy("createdAt", "desc").limit(200).onSnapshot(snap => {
      S.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.postsState = "ready";
      resolveNames(S.posts.map(p => p.authorId)).then(() => { if (S.tab === "community") render(true); });
      if (S.tab === "community") render(true);
    }, () => { S.postsState = "offline"; if (S.tab === "community") render(true); });
    db.collection("events").orderBy("date").limit(200).onSnapshot(snap => {
      S.events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      S.eventsState = "ready";
      if (S.tab === "eventi" || S.tab === "home") render(true);
    }, () => { S.eventsState = "offline"; });
    render(true);
  });
})();
</script>
